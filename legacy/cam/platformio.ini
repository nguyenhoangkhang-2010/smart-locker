; ESP32-CAM (AI-Thinker). Separate project from the locker firmware one
; folder up: it only listens for "capture" commands and uploads a photo.
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; camera + WiFi + MQTT outgrow the default 1.2 MB app partition on some cores
board_build.partitions = huge_app.csv

lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson@^7
