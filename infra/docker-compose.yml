# Hạ tầng cho Đề tài 67:  docker compose up -d   (cần Docker Desktop đang chạy)
# Tạo chứng chỉ trước:     python tools/make_certs.py --host localhost --device LOCKER-HCM-001
# Mật khẩu đặt trong infra/.env (không commit):  TSDB_PASSWORD=...   REDIS_PASSWORD=...
services:
  timescaledb:                       # PostgreSQL + TimescaleDB (migration 002 chạy khi có extension)
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: ${TSDB_PASSWORD:?đặt TSDB_PASSWORD trong infra/.env}
      POSTGRES_DB: smart_locker_v2
    ports: ["127.0.0.1:5433:5432"]   # chỉ máy này truy cập được
    volumes: [tsdb-data:/var/lib/postgresql/data]
    restart: unless-stopped

  redis:                             # OTP/đếm sai/refresh token có TTL
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?đặt REDIS_PASSWORD trong infra/.env}"]
    ports: ["127.0.0.1:6379:6379"]
    restart: unless-stopped

  mosquitto:                         # MQTT over TLS 1.2+, bắt buộc chứng chỉ máy khách (mTLS)
    image: eclipse-mosquitto:2
    ports: ["8883:8883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

volumes:
  tsdb-data:
  mosquitto-data:
