# Chỉ có listener TLS: không có cổng 1883 không mã hóa, không cho ẩn danh.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
# CN của chứng chỉ máy khách trở thành tên người dùng: LOCKER-HCM-001 hoặc locker-cloud
use_identity_as_username true
allow_anonymous false
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
# Thu hồi chứng chỉ của tủ bị mất cắp: tools/make_certs.py --revoke <device_id> sinh lại ca.crl, rồi
# docker compose restart mosquitto. (make_certs.py tạo sẵn CRL rỗng nên dòng này luôn hợp lệ.)
crlfile /mosquitto/certs/ca.crl
