[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = -Iinclude -Ilib/edge_core -Ilib/edge_esp32

lib_deps =
    bblanchon/ArduinoJson@^7
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9341

; Test lõi edge ngay trên máy, không cần ESP32:  pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra -Ilib/edge_core
lib_deps =
