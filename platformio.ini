[platformio]
; Nút Build/`pio run` chỉ build firmware. Môi trường native chỉ để test lõi trên máy: pio test -e native
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = -Iinclude -Ilib/edge_core -Ilib/edge_esp32

lib_deps =
    bblanchon/ArduinoJson@^7
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9341

; Bản có cảm biến vân tay R503 (mở rộng, chưa thử trên phần cứng): pio run -e esp32dev-fp. Chân 16/17 CHIA SẺ với UART2 của module 4G (DevKit hết GPIO rảnh); đổi theo board thật.
[env:esp32dev-fp]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DSECRET_FINGERPRINT=1 -DSECRET_FP_RX=16 -DSECRET_FP_TX=17
lib_deps =
    ${env:esp32dev.lib_deps}
    adafruit/Adafruit Fingerprint Sensor Library

; Test lõi edge ngay trên máy, không cần ESP32:  pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra -Ilib/edge_core
; không có Arduino.h trên máy: chỉ biên dịch lõi (lib/edge_core) khi test, bỏ qua phần ESP32 và src/
lib_ignore = edge_esp32
build_src_filter = -<*>
lib_deps =
